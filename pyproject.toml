[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mihop"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "mjsull", email = "Mitchell.Sullivan@health.qld.gov.au" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "click",
  "pandas",
  "snk-cli @git+https://github.com/bakeronit/snk-cli.git"
]

[project.urls]
Documentation = ""
Issues = ""
Source = ""

[project.scripts]
mihop = "mihop.cli:mihop"

[tool.hatch.version]
path = "src/mihop/__about__.py"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/mihop tests}"

[tool.coverage.run]
source_pkgs = ["mihop", "tests"]
branch = true
parallel = true
omit = [
  "src/mihop/__about__.py",
]

[tool.coverage.paths]
mihop = ["src/mihop", "*/mihop/src/mihop"]
tests = ["tests", "*/mihop/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
